name: Prime Resurgence data sync

on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-resurgence-data-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and validate provisional candidate
    # The official World State CDN returns 403 to Ubuntu-hosted runner networks.
    # macOS-hosted runners can fetch the same official endpoint directly.
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SYNC_MODE: ${{ github.event.schedule == '43 * * * *' && 'near-rotation' || 'announcement' }}
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Check out the default branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Public Export decompressor
        run: xz --version

      - name: Fetch, parse, and validate official data
        run: >-
          node scripts/prime-resurgence-sync.mjs
          --mode "$SYNC_MODE"
          --summary-file "$RUNNER_TEMP/prime-resurgence-summary.md"
          --pr-body-file "$RUNNER_TEMP/prime-resurgence-pr.md"

      - name: Verify repository
        run: npm run verify

      - name: Package an allowlisted candidate artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          managed_paths=()
          while IFS= read -r managed_path; do
            managed_paths+=("$managed_path")
          done < <(node scripts/prime-resurgence-sync.mjs --print-managed-paths)
          is_managed_path() {
            local candidate="$1"
            local managed_path
            for managed_path in "${managed_paths[@]}"; do
              [ "$candidate" = "$managed_path" ] && return 0
            done
            return 1
          }
          while IFS= read -r changed_path; do
            if ! is_managed_path "$changed_path"; then
              echo "Unexpected generated path: $changed_path" >&2
              exit 1
            fi
          done < <(git diff --name-only)

          if git diff --quiet -- "${managed_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact="$RUNNER_TEMP/prime-resurgence-candidate"
          mkdir -p "$artifact/data"
          for managed_path in "${managed_paths[@]}"; do
            cp "$managed_path" "$artifact/$managed_path"
          done
          cp "$RUNNER_TEMP/prime-resurgence-summary.md" "$artifact/summary.md"
          cp "$RUNNER_TEMP/prime-resurgence-pr.md" "$artifact/pr-body.md"
          git rev-parse HEAD > "$artifact/base-sha.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the validated candidate
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prime-resurgence-candidate
          path: ${{ runner.temp }}/prime-resurgence-candidate
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish an immutable candidate Draft PR
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      AUTOMATION_BRANCH: automation/prime-resurgence-sync
      PR_TITLE: "chore: prepare Prime Resurgence data update"
    steps:
      - name: Check out the validated base without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the validated candidate
        uses: actions/download-artifact@v4
        with:
          name: prime-resurgence-candidate
          path: ${{ runner.temp }}/prime-resurgence-candidate

      - name: Publish or cleanly skip the candidate Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prime-resurgence-publish.mjs
